<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Teacher Screen – Projector View</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/lesson-plan.svg">

    <!-- Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.onload=null;this.media='all'">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/main.css?v=31">
    <link rel="stylesheet" href="css/behaviour-tracker.css?v=4">
    <link rel="stylesheet" href="css/quiz-master.css?v=1">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/theme/black.css">

    <!-- External Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" media="print" onload="this.onload=null;this.media='all'">
</head>
<body class="projector-view theme-professional">
    <div id="presentation-root"></div>
    <div id="app-container" class="app-container" style="margin-top: 0; height: 100vh;">
        <section id="student-view" class="view student-view" role="region" aria-label="Projector View">
            <div id="widgets-container" class="widgets-grid">
                <!-- Widgets are dynamically added here by JavaScript -->
            </div>
            <aside id="classroom-reminder-dock" class="classroom-reminder-dock classroom-reminder-dock--projector" aria-labelledby="classroom-reminder-title" hidden>
                <header class="classroom-reminder-dock__header">
                    <div>
                        <p class="classroom-reminder-dock__eyebrow">Remember</p>
                        <h2 id="classroom-reminder-title">Class reminders</h2>
                    </div>
                </header>
                <div id="classroom-reminder-panel" class="classroom-reminder-dock__panel">
                    <div id="classroom-reminder-list" class="classroom-reminder-list" aria-live="polite"></div>
                </div>
            </aside>
        </section>
    </div>

    <!-- Scripts -->
    <!-- Reveal slide sync listener is initialized in js/projector.js -->
    <script src="js/widgets/pomodoro/pomodoro-widget.js"></script>
    <script type="module" src="js/projector.js?v=4"></script>

    <style>
        /* Projector View Overrides */
        #presentation-root {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }

        #presentation-root:empty {
            display: none;
        }

        #presentation-root .reveal,
        #presentation-root .slides {
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        .projector-view:not(.edit-mode) .widget-header {
            display: none !important;
        }

        .projector-view:not(.edit-mode) .resize-handle {
            display: none !important;
        }

        .projector-view.edit-mode .resize-handle {
            display: block;
        }

        .projector-view.edit-mode .widget {
            outline: 2px dashed rgba(255,255,255,0.4);
        }

        .projector-view .widget {
            box-shadow: none;
        }

        .projector-view .reveal-manager__topbar,
        .projector-view .reveal-manager__panel {
            display: none !important;
        }

        .projector-view .reveal-manager-widget-content,
        .projector-view .reveal-manager,
        .projector-view .reveal-manager__stage,
        .projector-view .reveal-container,
        .projector-view .reveal-manager-frame-wrap,
        .projector-view .reveal-inline-deck,
        .projector-view .reveal-inline-deck .reveal,
        .projector-view .reveal-inline-deck .slides {
            height: 100%;
            min-height: 0;
        }
    </style>
</body>
</html>
