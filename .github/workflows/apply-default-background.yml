name: Apply default deck background

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: default-deck-background-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'change-default-deck-background'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply the exact source updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected_count=1):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              old_count = text.count(old)
              if old_count == expected_count:
                  file_path.write_text(text.replace(old, new), encoding='utf-8')
                  return
              if old_count == 0 and new in text:
                  print(f'{path}: requested update is already present')
                  return
              raise SystemExit(
                  f'{path}: expected {expected_count} occurrence(s), found {old_count}: {old!r}'
              )

          replace_exact(
              'js/utils/background-manager.js',
              "    const oceanDefaultGradient = 'linear-gradient(135deg, #0f172a 0%, #16324a 55%, #164e63 100%)';",
              "    const oceanDefaultGradient = 'linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%)';\n"
              "    const oceanTwilightGradient = 'linear-gradient(135deg, #0f172a 0%, #16324a 55%, #164e63 100%)';"
          )
          replace_exact(
              'js/utils/background-manager.js',
              "      gradient: [\n"
              "        oceanDefaultGradient,\n"
              "        'linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%)',\n"
              "        'linear-gradient(to top, #a8edea 0%, #fed6e3 100%)'\n"
              "      ],",
              "      gradient: [\n"
              "        oceanDefaultGradient,\n"
              "        oceanTwilightGradient,\n"
              "        'linear-gradient(to top, #a8edea 0%, #fed6e3 100%)'\n"
              "      ],"
          )
          replace_exact(
              'tests/smoke-app.js',
              "    const oceanDefaultGradient = 'linear-gradient(135deg, #0f172a 0%, #16324a 55%, #164e63 100%)';",
              "    const oceanDefaultGradient = 'linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%)';"
          )
          replace_exact(
              'tests/smoke-app.js',
              'New Deck should use the Ocean twilight gradient',
              'New Deck should use the Ocean sky gradient'
          )
          replace_exact(
              'tests/smoke-app.js',
              'New Deck should save the Ocean twilight gradient with its first page',
              'New Deck should save the Ocean sky gradient with its first page'
          )
          replace_exact(
              'js/index.js',
              "const LOCAL_ASSET_VERSION = '35';",
              "const LOCAL_ASSET_VERSION = '36';"
          )
          replace_exact(
              'index.html',
              'js/index.js?v=30',
              'js/index.js?v=31',
              expected_count=2
          )
          replace_exact(
              'js/projector.js',
              "const PROJECTOR_LOCAL_ASSET_VERSION = '35';",
              "const PROJECTOR_LOCAL_ASSET_VERSION = '36';"
          )
          replace_exact(
              'projector.html',
              'js/projector.js?v=7',
              'js/projector.js?v=8'
          )
          PY

      - name: Install test dependencies
        run: npm ci

      - name: Validate source and browser behaviour
        shell: bash
        run: |
          npm run check:syntax
          node --check js/utils/background-manager.js
          node --check tests/smoke-app.js
          node tests/smoke-app.js --new-deck-only
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');

          const expected = 'linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%)';
          const previous = 'linear-gradient(135deg, #0f172a 0%, #16324a 55%, #164e63 100%)';
          const storage = new Map();
          const sandbox = {
            console,
            localStorage: {
              getItem: (key) => storage.has(key) ? storage.get(key) : null,
              setItem: (key, value) => storage.set(key, String(value)),
              removeItem: (key) => storage.delete(key)
            }
          };
          vm.createContext(sandbox);
          const source = fs.readFileSync('js/utils/background-manager.js', 'utf8');
          vm.runInContext(`${source}\n;globalThis.__BackgroundManager = BackgroundManager;`, sandbox);

          const container = { style: {} };
          const manager = new sandbox.__BackgroundManager(container);
          const defaultBackground = manager.getThemeDefaultBackground('theme-ocean');
          assert.equal(defaultBackground.type, 'gradient');
          assert.equal(defaultBackground.value, expected);
          assert.equal(defaultBackground.source, 'theme-default');
          assert.equal(defaultBackground.theme, 'theme-ocean');

          manager.reset('theme-ocean');
          assert.equal(manager.serialize().value, expected);
          assert.equal(container.style.backgroundImage, expected);

          const gradients = manager.getAvailableBackgrounds().gradient;
          assert.equal(gradients[0], expected);
          assert.equal(gradients[1], previous);

          const smokeSource = fs.readFileSync('tests/smoke-app.js', 'utf8');
          assert(smokeSource.includes(`const oceanDefaultGradient = '${expected}';`));
          assert(smokeSource.includes('New Deck should use the Ocean sky gradient'));
          assert(!smokeSource.includes('New Deck should use the Ocean twilight gradient'));
          console.log('Default deck background validation passed.');
          NODE

      - name: Commit the validated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'The source update is already committed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/utils/background-manager.js tests/smoke-app.js js/index.js index.html js/projector.js projector.html
          git diff --cached --check
          git commit -m "Use sky gradient for new decks"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
